    <rect x="22" y="25" width="16" height="22" rx="3" fill="#EF4444"/>
    <rect x="57" y="18" width="16" height="22" rx="3" fill="#EC4899"/>
    <rect x="92" y="25" width="16" height="22" rx="3" fill="#06B6D4"/>
    <text x="65" y="168" text-anchor="middle" fill="#E2E8F0" font-family="system-ui, sans-serif" font-size="12" font-weight="700">5. ENVIO 24/7</text>
