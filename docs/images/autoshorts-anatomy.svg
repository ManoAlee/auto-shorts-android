    <rect x="44" y="82" width="38" height="9" rx="2" fill="#FACC15"/>
    <rect x="31" y="95" width="64" height="8" rx="2" fill="#F8FAFC"/>
    <!-- Safe subtitle band (MarginV=300px) -->
    <rect x="33" y="124" width="60" height="10" rx="3" fill="#34D399" opacity="0.9"/>
    <!-- Bottom TikTok/Reels unsafe zone (bottom 450px @1080p) -->
    <rect x="21" y="138" width="84" height="26" rx="6" fill="#EF4444" opacity="0.28"/>
    <line x1="21" y1="138" x2="105" y2="138" stroke="#EF4444" stroke-width="1" stroke-dasharray="3 2"/>
