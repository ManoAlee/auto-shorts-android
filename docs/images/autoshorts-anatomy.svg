    <circle cx="35" cy="95" r="5" fill="#38BDF8"/>
    <circle cx="52" cy="102" r="5" fill="#34D399"/>
    <text x="70" y="168" text-anchor="middle" fill="#E2E8F0" font-family="system-ui, sans-serif" font-size="12" font-weight="700">1. INGESTÃO</text>
    <text x="70" y="184" text-anchor="middle" fill="#94A3B8" font-family="ui-monospace, monospace" font-size="10">bsk + 8h VOD + RSS</text>
  </g>

