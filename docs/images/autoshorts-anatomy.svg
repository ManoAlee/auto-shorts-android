    <polygon points="0,45 70,75 70,155 0,125" fill="#1E293B" stroke="#475569" stroke-width="1.2"/>
    <polygon points="70,75 140,45 140,125 70,155" fill="#0F172A" stroke="#475569" stroke-width="1.2"/>
