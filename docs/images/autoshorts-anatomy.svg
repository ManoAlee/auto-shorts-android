    <polygon points="0,45 65,72 65,142 0,115" fill="#1E293B" stroke="#475569" stroke-width="1.2"/>
    <polygon points="65,72 130,45 130,115 65,142" fill="#0F172A" stroke="#475569" stroke-width="1.2"/>
