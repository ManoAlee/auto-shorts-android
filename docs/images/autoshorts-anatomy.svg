    <rect x="20" y="88" width="38" height="8" rx="2" fill="#FACC15" transform="skewY(22)"/>
    <rect x="20" y="101" width="38" height="8" rx="2" fill="#34D399" transform="skewY(22)"/>
    <rect x="20" y="114" width="38" height="8" rx="2" fill="#A855F7" transform="skewY(22)"/>
    <text x="75" y="188" text-anchor="middle" fill="#E2E8F0" font-family="system-ui, sans-serif" font-size="12" font-weight="700">2. MOTOR 4-ATOS</text>
    <text x="75" y="204" text-anchor="middle" fill="#94A3B8" font-family="ui-monospace, monospace" font-size="10">Whisper + Mahoraga</text>
