<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 520" width="1120" height="520">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0B1120"/>
      <stop offset="100%" stop-color="#111827"/>
    </linearGradient>
    <linearGradient id="railGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#1E293B"/>
      <stop offset="50%" stop-color="#334155"/>
      <stop offset="100%" stop-color="#1E293B"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FDE047"/>
      <stop offset="100%" stop-color="#CA8A04"/>
    </linearGradient>
    <linearGradient id="cyanGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#0284C7"/>
    </linearGradient>
    <linearGradient id="emeraldGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#34D399"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#000000" flood-opacity="0.45"/>
    </filter>
  </defs>

  <!-- Card Frame -->
  <rect x="0" y="0" width="1120" height="520" rx="18" fill="url(#bgGrad)" stroke="#1E293B" stroke-width="2"/>
  <rect x="14" y="14" width="1092" height="492" rx="12" fill="none" stroke="#334155" stroke-width="1" stroke-dasharray="4 4" opacity="0.5"/>

  <!-- Top Card Header (Anatomy Instrumentation Style) -->
  <text x="32" y="44" fill="#94A3B8" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13" font-weight="700">FIG. 01 — AUTOSHORTS ARM64 BENCH</text>
  <text x="1088" y="44" text-anchor="end" fill="#F8FAFC" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="700">9:16 Autonomous Video Assembly Rig</text>

  <!-- Heavy Machined Base Plate (Isometric Bench) -->
  <g filter="url(#softGlow)">
    <!-- Base bottom bevel -->
    <polygon points="80,355 560,465 1040,355 560,245" fill="#0F172A" stroke="#334155" stroke-width="1.5"/>
    <!-- Base top deck -->
    <polygon points="80,340 560,450 1040,340 560,230" fill="#1E293B" stroke="#475569" stroke-width="1.5"/>
    <!-- Corner leveling feet -->
    <ellipse cx="110" cy="356" rx="12" ry="6" fill="#020617" stroke="#475569" stroke-width="1"/>
    <ellipse cx="560" cy="466" rx="14" ry="7" fill="#020617" stroke="#475569" stroke-width="1"/>
    <ellipse cx="1010" cy="356" rx="12" ry="6" fill="#020617" stroke="#475569" stroke-width="1"/>
    <!-- Machined precision rail tracks -->
    <line x1="150" y1="335" x2="970" y2="335" stroke="#475569" stroke-width="6" stroke-linecap="round"/>
    <line x1="150" y1="335" x2="970" y2="335" stroke="#94A3B8" stroke-width="1.5" stroke-dasharray="10 6"/>
  </g>

  <!-- STAGE 1: Discovery + BrowserSkill bsk Hopper -->
  <g transform="translate(115, 165)" filter="url(#softGlow)">
    <polygon points="0,45 70,15 140,45 70,75" fill="#334155" stroke="#64748B" stroke-width="1.2"/>
    <polygon points="0,45 70,75 70,145 0,115" fill="#1E293B" stroke="#475569" stroke-width="1.2"/>
    <polygon points="70,75 140,45 140,115 70,145" fill="#0F172A" stroke="#475569" stroke-width="1.2"/>
